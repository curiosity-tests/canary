---
name: Reusable Lua Tests

on:
  workflow_call:
    inputs:
      chalk_on:
        description: "racecar: instrumented arm switch, passed down by the caller"
        type: string
        default: "false"
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, forwarded by the caller"
        type: string
        default: ""
      checkout_ref:
        description: Optional ref or SHA to check out.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.chalk_on }}

jobs:
  job:
    name: Run Lua Tests
    runs-on: ubuntu-latest
    steps:
      - name: Setup Lua
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Check out code
        if: inputs.checkout_ref == ''
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
          fetch-depth: 0
          persist-credentials: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Check out requested ref
        if: inputs.checkout_ref != ''
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.checkout_ref }}
      - name: Run Tests
        run: |
          failed=0
          for f in tests/lua/test_*.lua; do
            echo "=== $f ==="
            if ! luajit "$f"; then
              failed=1
            fi
          done
          exit $failed
