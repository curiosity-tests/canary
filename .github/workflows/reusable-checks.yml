name: Reusable Fast Checks

on:
  workflow_call:
    inputs:
      chalk_on:
        description: "racecar: instrumented arm switch, passed down by the caller"
        type: string
        default: "false"
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, forwarded by the caller"
        type: string
        default: ""
      checkout_ref:
        description: Optional ref or SHA to check out.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.chalk_on }}

jobs:
  run-checks:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository (PR head branch for same-repo PRs)
      if: inputs.checkout_ref == '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ github.head_ref }}
    - name: Checkout repository (default ref)
      if: inputs.checkout_ref == '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10    # v6
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Checkout requested ref
      if: inputs.checkout_ref != ''
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10    # v6
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ inputs.checkout_ref }}

    - name: Set up pinned Python
      uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14    # v4.2.3
      with:
        version: 2026.5.15
        install_args: python
        cache: true
        env: false

    - name: Set up Git
      run: |
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "GitHub Actions"

    - name: Setup reviewdog
      uses: reviewdog/action-setup@v1.0.3

    - name: Setup Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y libluajit-5.1-dev luajit lua-check cppcheck libxml2-utils python3-pip

    - name: Run clang format lint
      uses: DoozyX/clang-format-lint-action@v0.17
      with:
        source: "src tests"
        exclude: "src/protobuf"
        extensions: "cpp,hpp,h"
        clangFormatVersion: 17
        inplace: true

    - uses: JohnnyMorganz/stylua-action@v5
      with:
        token: ${{ github.token }}
        version: latest
        args: .

    - name: Run cmake-format
      run: |
        python -m pip install --require-hashes -r .github/requirements-cmake-format.txt
        find . -name "CMakeLists.txt" -o -name "*.cmake" | grep -v build/ | grep -v vcpkg_installed/ | xargs python -m cmakelang.format -i

    - name: Commit formatting changes
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      uses: EndBug/add-and-commit@v10
      with:
        author_name: GitHub Actions
        author_email: github-actions[bot]@users.noreply.github.com
        message: "style: auto-formatting (clang/stylua/cmake)"
        add: |
          src
          tests
          data
          data-canary
          data-otservbr-global
          CMakeLists.txt
          **/*.cmake
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Check formatting diff
      id: formatting-diff
      shell: bash
      run: |
        if git diff --quiet && git diff --cached --quiet; then
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "has_changes=true" >> "$GITHUB_OUTPUT"
        git status --short
        git diff --binary > formatting.patch
        git diff --cached --binary >> formatting.patch

    - name: Upload formatting patch
      if: steps.formatting-diff.outputs.has_changes == 'true' && github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: formatting.patch
        path: formatting.patch

    - name: Fail on formatting changes
      if: steps.formatting-diff.outputs.has_changes == 'true'
      run: |
        echo "::error::Formatting changes are required. The autofix.ci workflow should push a formatter commit automatically; if it cannot, apply the formatting.patch artifact or run the formatters locally and push the result."
        exit 1

    - name: Check Lua API documentation quality
      run: python3 tools/check_lua_api_quality.py

    - name: Check new Lua API binding documentation
      run: python3 tools/check_lua_api_binding_docs.py

    - name: Run Analysis (Reviewdog)
      if: github.event_name == 'pull_request'
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        REVIEWDOG_REPORTER: github-pr-check
      run: |
        reviewdog -reporter="${REVIEWDOG_REPORTER}" -runners=luac -fail-level=error -filter-mode=added
        reviewdog -reporter="${REVIEWDOG_REPORTER}" -runners=luacheck -filter-mode=added || true
        reviewdog -reporter="${REVIEWDOG_REPORTER}" -runners=xmllint -fail-level=error -filter-mode=added
        reviewdog -reporter="${REVIEWDOG_REPORTER}" -runners=cppcheck -filter-mode=added || true

    - name: Run yamllint
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REVIEWDOG_REPORTER: github-pr-check
      run: |
        python3 -m pip install yamllint

        REVIEWDOG_DIFF_FLAGS=()
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          git fetch --no-tags --prune origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          REVIEWDOG_DIFF_FLAGS=(-diff="git diff --no-ext-diff --relative origin/${{ github.base_ref }}...HEAD")
        fi

        yamllint --format parsable . |
          reviewdog \
            -efm="%f:%l:%c: %m" \
            -name="yamllint" \
            -reporter="${REVIEWDOG_REPORTER}" \
            -level=error \
            -filter-mode=added \
            -fail-on-error=false \
            "${REVIEWDOG_DIFF_FLAGS[@]}"
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
