---
name: Reusable Docker Quickstart Smoke

on:
  workflow_call:
    inputs:
      chalk_on:
        description: "racecar: instrumented arm switch, passed down by the caller"
        type: string
        default: "false"
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, forwarded by the caller"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.chalk_on }}

jobs:
  smoke:
    name: Quickstart Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Download Docker image artifact
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: actions/download-artifact@v7
        with:
          name: canary-docker-image
          path: artifacts/docker-image

      - name: Run Docker quickstart smoke (PR image)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        env:
          CANARY_IMAGE: ghcr.io/${{ github.repository }}:pr
          CANARY_IMAGE_TAR: artifacts/docker-image/canary-pr.tar
        run: bash .github/scripts/docker-quickstart-smoke.sh

      - name: Run Docker quickstart smoke (latest image)
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        env:
          CANARY_IMAGE: ghcr.io/opentibiabr/canary:latest
        run: bash .github/scripts/docker-quickstart-smoke.sh
